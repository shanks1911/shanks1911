<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 494" width="1012" height="494" role="img" aria-label="Current research. Market Microstructure Research Platform. Estimating fair value from high-frequency futures limit order books. Method: LOB snapshots, estimator, point-in-time replay, block bootstrap, significance test, accept or reject. Estimators: microprice, weighted midprice, order flow imbalance, queue imbalance. Evaluation: point-in-time replay, walk-forward splits, frozen holdout, significance testing. Next: inventory-aware quoting, optimal execution, reinforcement learning, low-latency C++. Python, NumPy, Databento, statsmodels, C++.">
