<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sanket Dangle — Quantitative Research and Market Microstructure">
  <defs>
    <linearGradient id="bidGrad" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="askGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="10" fill="#0b1220"/>

  <!-- ── left: identity ── -->
  <text x="72" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#f1f5f9" letter-spacing="1.5">Sanket Dangle</text>

  <rect x="73" y="140" width="46" height="2" fill="#2563eb"/>

  <text x="72" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#94a3b8" letter-spacing="2.6">QUANTITATIVE RESEARCH · MARKET MICROSTRUCTURE</text>
  <text x="72" y="198" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#64748b" letter-spacing="2.6">M.S. COMPUTER SCIENCE · COLUMBIA UNIVERSITY</text>

  <!-- ── right: limit order book depth ladder ── -->
  <g>
    <!-- ask side (above mid) -->
    <rect x="908" y="44"  width="176" height="9" rx="1.5" fill="url(#askGrad)"/>
    <rect x="908" y="59"  width="118" height="9" rx="1.5" fill="url(#askGrad)"/>
    <rect x="908" y="74"  width="196" height="9" rx="1.5" fill="url(#askGrad)"/>
    <rect x="908" y="89"  width="86"  height="9" rx="1.5" fill="url(#askGrad)"/>
    <rect x="908" y="104" width="142" height="9" rx="1.5" fill="url(#askGrad)"/>
    <rect x="908" y="119" width="64"  height="9" rx="1.5" fill="url(#askGrad)"/>

    <!-- mid -->
    <line x1="742" y1="140" x2="1128" y2="140" stroke="#334155" stroke-width="1"/>
    <circle cx="908" cy="140" r="3" fill="#2563eb"/>

    <!-- bid side (below mid) -->
    <rect x="800" y="151" width="108" height="9" rx="1.5" fill="url(#bidGrad)"/>
    <rect x="732" y="166" width="176" height="9" rx="1.5" fill="url(#bidGrad)"/>
    <rect x="838" y="181" width="70"  height="9" rx="1.5" fill="url(#bidGrad)"/>
    <rect x="762" y="196" width="146" height="9" rx="1.5" fill="url(#bidGrad)"/>
    <rect x="808" y="211" width="100" height="9" rx="1.5" fill="url(#bidGrad)"/>
    <rect x="852" y="226" width="56"  height="9" rx="1.5" fill="url(#bidGrad)"/>

    <text x="1140" y="52"  font-family="ui-monospace, monospace" font-size="9" fill="#475569" letter-spacing="1">ASK</text>
    <text x="1140" y="235" font-family="ui-monospace, monospace" font-size="9" fill="#475569" letter-spacing="1">BID</text>
  </g>
</svg>
